name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Select release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          current="$(git tag --points-at HEAD -l 'v0.1.*' --sort=-v:refname | head -n 1)"
          if [[ -n "$current" ]]; then
            echo "tag=$current" >> "$GITHUB_OUTPUT"
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest="$(git tag -l 'v0.1.*' --sort=-v:refname | head -n 1)"
          if [[ -z "$latest" ]]; then
            next="v0.1.0"
          else
            patch="${latest##*.}"
            next="v0.1.$((patch + 1))"
          fi

          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "create=true" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        if: steps.tag.outputs.create == 'true'
        run: |
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: flexdinesh/homebrew-tap
          ref: main
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Generate Homebrew formula
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/flexdinesh/checksy/archive/refs/tags/${RELEASE_TAG}.tar.gz" \
            --output "$RUNNER_TEMP/checksy-source.tar.gz"
          mkdir -p homebrew-tap/Formula
          go run ./tools/homebrew-formula -tag "$RELEASE_TAG" \
            -archive "$RUNNER_TEMP/checksy-source.tar.gz" > homebrew-tap/Formula/checksy.rb
          rm -f homebrew-tap/Casks/checksy.rb

      - name: Open Homebrew tap pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          base: main
          branch: checksy-${{ steps.tag.outputs.tag }}
          commit-message: "Update checksy to ${{ steps.tag.outputs.tag }}"
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          title: "Update checksy to ${{ steps.tag.outputs.tag }}"
          body: |
            - Build checksy from the checksum-verified release source with Go.
            - Replace the prebuilt cask to avoid macOS Gatekeeper warnings.
            - Install with `brew install flexdinesh/tap/checksy`.
